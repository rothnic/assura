commands:
  - name: "assura"
    allow_positionals: false
    flags:
      --config:
        aliases: ["-c"]
        takes_value: true
      --verbose:
        aliases: ["-v"]
      --quiet: {}
      --help:
        aliases: ["-h"]
      --version:
        aliases: ["-V"]
  - name: "assura check"
    allow_positionals: true
    flags:
      --config:
        aliases: ["-c"]
        takes_value: true
      --verbose:
        aliases: ["-v"]
      --quiet: {}
      --help:
        aliases: ["-h"]
      --format:
        aliases: ["-f"]
        takes_value: true
        values: ["text", "json", "yaml", "advice", "status", "agent"]
      --agent:
        takes_value: true
        values: ["generic", "codex"]
        requires:
          --format: "agent"
      --min-severity:
        takes_value: true
        values: ["low", "medium", "high", "critical"]
      --max-issues:
        takes_value: true
      --output:
        aliases: ["-o"]
        takes_value: true
      --fail-fast: {}
      --warn: {}
      --no-parallel: {}
      --ls-lint-target-semantics: {}
      --watch: {}
  - name: "assura status"
    allow_positionals: true
    flags:
      --config:
        aliases: ["-c"]
        takes_value: true
      --verbose:
        aliases: ["-v"]
      --quiet: {}
      --help:
        aliases: ["-h"]
      --format:
        aliases: ["-f"]
        takes_value: true
        values: ["text", "json", "yaml", "advice", "status"]
  - name: "assura init"
    allow_positionals: true
    flags:
      --config:
        aliases: ["-c"]
        takes_value: true
      --verbose:
        aliases: ["-v"]
      --quiet: {}
      --help:
        aliases: ["-h"]
      --force: {}
      --no-git-hooks: {}
  - name: "assura watch"
    allow_positionals: true
    flags:
      --config:
        aliases: ["-c"]
        takes_value: true
      --verbose:
        aliases: ["-v"]
      --quiet: {}
      --help:
        aliases: ["-h"]
      --debounce:
        aliases: ["-d"]
        takes_value: true
      --no-git: {}
  - name: "assura migrate"
    allow_positionals: true
    flags:
      --config:
        aliases: ["-c"]
        takes_value: true
      --verbose:
        aliases: ["-v"]
      --quiet: {}
      --help:
        aliases: ["-h"]
      --output:
        aliases: ["-o"]
        takes_value: true
  - name: "assura fix markdown"
    allow_positionals: true
    flags:
      --config:
        aliases: ["-c"]
        takes_value: true
      --verbose:
        aliases: ["-v"]
      --quiet: {}
      --help:
        aliases: ["-h"]
      --rule:
        takes_value: true
        values: ["trailing-spaces"]
  - name: "assura content"
    allow_positionals: false
    flags:
      --config:
        aliases: ["-c"]
        takes_value: true
      --verbose:
