version: "2.0"

project:
  name: "assura"
  description: "Dependency-aware file system validation engine"

# Root directory - only standard project files allowed
# Special documents (AGENTS.md, CONSTITUTION.md) allowed in SCREAMING_SNAKE_CASE
# All other root files must be standard project files
structure:
  ./:
    files:
      # Standard project files are allowed
      allowed_names:
        # Core documentation (standard project files)
        - "README.md"
        - "CHANGELOG.md"
        - "CONTRIBUTING.md"
        - "CODE_OF_CONDUCT.md"
        - "SECURITY.md"
        # Special documents (exception to naming convention)
        - "AGENTS.md"
        - "CONSTITUTION.md"
        # License files
        - "LICENSE"
        - "LICENSE-MIT"
        - "LICENSE-APACHE"
        # Project/tooling manifests
        - ".gitignore"
        - "Cargo.lock"
        - "Cargo.toml"
        - "package.json"
        - "PROJECT_CONTEXT.md"
      # Required files that must exist in root
      required:
        - "README.md"
        - "AGENTS.md"
      naming: "PascalCase"
      allow_extra: false
    directories:
      allowed_names:
        - ".agents"
        - ".assura"
        - ".cargo"
        - ".codex"
        - ".github"
        - ".trellis"
        - "benches"
        - "crates"
        - "docs"
        - "integrations"
        - "src"
        - "tests"
        - "website"
      allow_extra: false
    
    # Subdirectories
    children:
      .agents/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "README.md"
            - "SKILL.md"
            - "TEMPLATE.md"
            - "prd.json"
          allow_extra: false
        directories:
          allowed_names:
            - "skills"
          allow_extra: false
        children:
          skills/:
            files:
              naming: "kebab-case"
              naming_patterns:
                "SKILL.md": "regex:^SKILL$"
              allowed_names:
                - "README.md"
                - "TEMPLATE.md"
              allow_extra: false
            directories:
              naming: "kebab-case"
      
      .assura/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "config.new.yml"
            - "config.yml"
            - "config.yml.v1"
          allow_extra: false
        directories:
          allowed_names:
            - "hooks"
          allow_extra: false
        children:
          hooks/:
            files:
              naming: "kebab-case"

      .cargo/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "config.toml"
          allow_extra: false
        directories:
          allow_extra: false

      .codex/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "config.toml"
            - "hooks.json"
          allow_extra: false
        directories:
          allowed_names:
            - "agents"
            - "hooks"
            - "skills"
          allow_extra: false
        children:
          agents/:
            files:
              naming: "kebab-case"
          hooks/:
            files:
              naming: "kebab-case"
      
      .github/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "PULL_REQUEST_TEMPLATE.md"
          allow_extra: false
        directories:
          allowed_names:
            - "ISSUE_TEMPLATE"
            - "workflows"
          allow_extra: false
        children:
          ISSUE_TEMPLATE/:
            files:
              naming: "snake_case"
          workflows/:
            files:
              naming: "kebab-case"
      
      benches/:
        files:
          naming: "snake_case"
          max_lines: 1200
          allowed_names:
            - "README.md"
        directories:
          allowed_names:
            - "history"
          allow_extra: false
        children:
          history/:
            files:
              naming: "kebab-case"
              max_lines: 2000
              allowed_names:
                - "README.md"

      crates/:
        files:
          allow_extra: false
        directories:
          naming: "kebab-case"
        children:
          assura-check-cli/:
            files:
              naming: "kebab-case"
              allowed_names:
                - "Cargo.toml"
              allow_extra: false
            directories:
              allowed_names:
                - "src"
                - "tests"
              allow_extra: false
            children:
              src/:
                files:
                  naming: "snake_case"
                  max_lines: 500
              tests/:
                files:
                  naming: "snake_case"
                  max_lines: 500
      
      docs/:
        files:
          naming: "kebab-case"
          max_lines: 500
        markdown:
          require_frontmatter: true
        directories:
          allowed_names:
            - "analysis"
            - "archive"
            - "goals"
            - "proposals"
          allow_extra: false
        children:
          analysis/:
            files:
              naming: "kebab-case"
              max_lines: 1000
            markdown:
              require_frontmatter: true
          archive/:
            files:
              naming: "kebab-case"
              max_lines: 2000
            markdown:
              require_frontmatter: true
          goals/:
            files:
              naming: "kebab-case"
              max_lines: 2000
            markdown:
              require_frontmatter: true
          proposals/:
            files:
              naming: "kebab-case"
              max_lines: 1000
            markdown:
              require_frontmatter: true

      integrations/:
        files:
          naming: "kebab-case"
          allow_extra: false
        directories:
          allowed_names:
            - "agents"
          allow_extra: false
        children:
          agents/:
            files:
              naming: "kebab-case"
              allowed_names:
                - "README.md"
              allow_extra: false
            directories:
              allowed_names:
                - "codex"
                - "opencode"
              allow_extra: false
            children:
              codex/:
                files:
                  naming: "kebab-case"
                  allowed_names:
                    - "README.md"
                    - "package.json"
                    - "tsconfig.json"
                  allow_extra: false
                directories:
                  allowed_names:
                    - "src"
                  allow_extra: false
                children:
                  src/:
                    files:
                      naming: "kebab-case"
              opencode/:
                files:
                  naming: "kebab-case"
                  allowed_names:
                    - ".gitignore"
                    - "README.md"
                    - "bun.lock"
                    - "package.json"
                    - "tsconfig.json"
                    - "example.ts"
                    - "implementation-summary.md"
                    - "index.ts"
                  allow_extra: false
                directories:
                  allowed_names:
                    - "src"
                    - "tests"
                  allow_extra: false
                children:
                  src/:
                    files:
                      naming: "kebab-case"
                  tests/:
                    files:
                      naming: "kebab-case"
      
      src/:
        files:
          naming: "snake_case"
          max_lines: 500
          require_docs: true
        directories:
          allowed_names:
            - "cli"
            - "config"
            - "constraints"
            - "intelligence"
            - "ls_compat"
            - "markdown"
            - "maturity"
            - "validation"
          allow_extra: false
        children:
          cli/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          config/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          constraints/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          intelligence/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          ls_compat/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          markdown/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          maturity/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          validation/:
            files:
              naming: "snake_case"
              max_lines: 500
      
      .trellis/:
        files:
          naming: "kebab-case"
          max_lines: 2000
          allowed_names:
            - ".gitignore"
            - ".template-hashes.json"
            - ".version"
            - "config.yaml"
            - "workflow.md"
          allow_extra: false
        directories:
          allowed_names:
            - "scripts"
            - "spec"
            - "tasks"
            - "workspace"
          allow_extra: false
        children:
          scripts/:
            files:
              naming: "snake_case"
              naming_patterns:
                "__init__.py": "regex:^__init__$"
              max_lines: 1000
              allowed_names:
                - "__init__.py"
          spec/:
            files:
              naming: "kebab-case"
              max_lines: 1000
            markdown:
              require_frontmatter: false
          tasks/:
            files:
              naming: "kebab-case"
              max_lines: 1000
            markdown:
              require_frontmatter: false
          workspace/:
            files:
              naming: "kebab-case"
              max_lines: 1000
            markdown:
              require_frontmatter: false
      
      tests/:
        files:
          naming: "snake_case"
          max_lines: 1000
        directories:
          allow_extra: false
      
      website/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "README.md"
            - "astro.config.mjs"
            - "package.json"
            - "pnpm-lock.yaml"
            - "tsconfig.json"
          allow_extra: false
        directories:
          allowed_names:
            - "public"
            - "src"
          allow_extra: false

# Global exclusions
exclude:
  - "target/**"
  - ".git/**"
  - ".trellis/.developer"
  - ".trellis/.runtime/**"
  - "**/__pycache__"
  - "**/__pycache__/**"
  - "node_modules/**"
  - "node_modules"
  - "**/node_modules/**"
  - "**/node_modules"
  - ".astro/**"
  - ".astro"
  - "**/.astro"
  - "**/.astro/**"
  - "dist/**"
  - "dist"
  - "**/dist/**"
  - "**/dist"
  - "package-lock.json"
  - "**/package-lock.json"
