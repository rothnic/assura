version: "2.0"

project:
  name: "assura"
  description: "Structure-first repository validation CLI"

quality:
  scopes:
    docs:
      paths:
        - "AGENTS.md"
        - ".agents/**"
        - ".assura/**"
        - ".github/PULL_REQUEST_TEMPLATE.md"
        - ".trellis/**"
        - "docs/**"
      frequent:
        - "cargo run --quiet -- check --format json ."
        - "cargo xtask evidence"
        - "cargo xtask target-state"
        - "git diff --check"
    website:
      paths:
        - "website/package.json"
        - "website/pnpm-lock.yaml"
        - "website/astro.config.mjs"
        - "website/src/**"
        - "website/public/**"
        - "website/README.md"
        - "website/tsconfig.json"
      pre_push:
        - "cargo xtask docs"
    rust:
      paths:
        - "Cargo.toml"
        - "Cargo.lock"
        - ".cargo/**"
        - "benches/**"
        - "build.rs"
        - "src/**"
        - "tests/**"
        - "crates/**"
        - "examples/**"
      frequent:
        - "cargo xtask check"
        - "cargo xtask test"
        - "cargo xtask target-state"
        - "cargo run --quiet -- check --format json ."
      pr:
        - "cargo xtask pr"
      merge:
        - "Code Coverage"
    security:
      paths:
        - "Cargo.toml"
        - "Cargo.lock"
      pr:
        - "cargo xtask hygiene"
        - "Security Audit"
      scheduled:
        - "cargo xtask hygiene"
        - "Security Audit"
    release:
      paths:
        - "website/public/install.sh"
        - "website/public/install.ps1"
        - "scripts/smoke-install-adoption.sh"
        - "scripts/smoke-install-adoption.ps1"
        - "docs/release-notes.md"
        - "docs/release-candidate-checklist.md"
        - "docs/support-policy.md"
        - "docs/compatibility-and-surface.md"
      pr:
        - "cargo xtask release-smoke"
      merge:
        - "Release Bundle Smoke"
        - "Windows Installer Smoke"
        - "Installable Adoption Smoke"
    performance:
      paths:
        - "benches/**"
        - "benches/history/**"
        - "website/public/data/performance/**"
        - "website/src/content/docs/reference/performance*"
        - "docs/analysis/*performance*"
      pr:
        - "Performance Report"
        - "cargo xtask target-state"
        - "cargo xtask docs"
    workflow:
      paths:
        - ".github/workflows/**"
        - ".cargo/config.toml"
        - "scripts/ci-scope.sh"
        - "scripts/check-ci-scope.sh"
        - "scripts/summarize-rust-cache.sh"
        - "xtask/**"
      frequent:
        - "cargo run --quiet -- check --format json ."
        - "cargo xtask evidence"
        - "cargo xtask target-state"
        - "git diff --check"
      pr:
        - "cargo xtask pr"
        - "Release Bundle Smoke"
        - "Windows Installer Smoke"
        - "Installable Adoption Smoke"
        - "Code Coverage"
        - "Performance Report"
        - "Security Audit"

extensions:
  manifest_semantics:
    - id: cargo_workspace
      severity: high
      manifests:
        - path: Cargo.toml
          package: assura
          role: public
          version: "0.1.0"
          rust_version: "1.70.0"
          license: "MIT OR Apache-2.0"
          publish: public
          description_required_terms:
            - Structure-first
            - repository validation
          description_forbidden_terms:
            - dependency graph validation
          keywords:
            - structure
            - validation
          binaries:
            - assura
            - assura-full
        - path: crates/assura-check-cli/Cargo.toml
          package: assura-check-cli
          role: internal
          version: "0.1.0"
          rust_version: "1.70.0"
          license: "MIT OR Apache-2.0"
          publish: internal
          description_required_terms:
            - Internal
            - structure-check
          binaries:
            - assura-check
            - assura-checkd
            - assura-check-client
            - assura-check-session
            - assura-check-unix-client
            - assura-check-status
            - assura-check-noop
            - assura-check-compiled
            - assura-check-compile-config
        - path: crates/assura-stable-hash/Cargo.toml
          package: assura-stable-hash
          role: internal
          version: "0.1.0"
          rust_version: "1.70.0"
          license: "MIT OR Apache-2.0"
          publish: internal
          description_required_terms:
            - Internal
            - stable hash
        - path: xtask/Cargo.toml
          package: xtask
          role: internal
          version: "0.1.0"
          rust_version: "1.70.0"
          license: "MIT OR Apache-2.0"
          publish: internal
          description_required_terms:
            - Repository-local
            - maintenance tasks
  test_relationships:
    - id: supported_surface_tests
      severity: high
      relationships:
        - source: src/cli/check/docs_lifecycle.rs
          required_tests:
            - tests/docs_lifecycle_tests.rs
            - crates/assura-check-cli/tests/compiled_docs_lifecycle_cli.rs
        - source: src/cli/check/module_topology.rs
          required_tests:
            - tests/module_topology_tests.rs
            - crates/assura-check-cli/tests/compiled_module_topology_cli.rs
        - source: src/cli/check/test_relationship.rs
          required_tests:
            - tests/custom_constraints_tests.rs
            - crates/assura-check-cli/tests/compiled_test_relationship_cli.rs
        - source: src/cli/check/support_matrix.rs
          required_tests:
            - tests/custom_constraints_tests.rs
            - tests/support_matrix_expansion_tests.rs
            - crates/assura-check-cli/tests/compiled_support_matrix_cli.rs
        - source: src/cli/check/support_matrix_docs.rs
          required_tests:
            - tests/support_matrix_expansion_tests.rs
            - crates/assura-check-cli/tests/compiled_support_matrix_cli.rs
        - source: src/cli/check/manifest_semantics.rs
          required_tests:
            - tests/custom_constraints_tests.rs
            - crates/assura-check-cli/tests/compiled_manifest_semantics_cli.rs
      allowed_ignore_reasons:
        - manual_performance_audit
      ignored_tests:
        - path: tests/ls_lint_parity_regression_tests.rs
          test: ls_lint_parity_audit_performance_shapes
          reason: manual_performance_audit
  module_topologies:
    - id: public_rust_modules
      severity: high
      rust_exports:
        - src/lib.rs
      modules:
        - family: stable_hash
          status: internal
          owner: assura-maintainers
          purpose: internal stable hash implementation re-export
          roots:
            - crates/assura-stable-hash
          public_exports:
            - stable_hash
        - family: cli
          status: supported
          owner: assura-maintainers
          purpose: supported CLI and report surface implementation
          roots:
            - src/cli
          public_exports:
            - cli
        - family: config
          status: supported
          owner: assura-maintainers
          purpose: supported configuration format implementation
          roots:
            - src/config
          public_exports:
            - config
        - family: content_repository
          status: experimental
          owner: assura-maintainers
          purpose: experimental repo-native content runtime internals
          roots:
            - src/content_repository
          public_exports:
            - content_repository
        - family: constraints
          status: experimental
          owner: assura-maintainers
          purpose: experimental full-cli constraint internals
          roots:
            - src/constraints
          public_exports:
            - constraints
        - family: intelligence
          status: internal
          owner: assura-maintainers
          purpose: contained dependency-intelligence internals
          roots:
            - src/intelligence
          public_exports:
            - intelligence
        - family: markdown
          status: experimental
          owner: assura-maintainers
          purpose: experimental Markdown validation internals
          roots:
            - src/markdown
          public_exports:
            - markdown
        - family: maturity
          status: internal
          owner: assura-maintainers
          purpose: contained maturity detection internals
          roots:
            - src/maturity
          public_exports:
            - maturity
        - family: validation
          status: internal
          owner: assura-maintainers
          purpose: internal validation engine APIs
          roots:
            - src/validation
          public_exports:
            - validation
  docs_lifecycles:
    - id: active_goal_docs
      severity: medium
      active:
        - .trellis/spec/assura/roadmap.md
        - docs/project-memories.md
        - docs/release-notes.md
        - docs/support-policy.md
        - docs/compatibility-and-surface.md
        - docs/release-candidate-checklist.md
        - docs/validation.md
        - docs/analysis/2026-06-09-assura-best-practice-target-state.md
        - docs/goals/assura-rule-docs-lifecycle-stale-claims.md
        - docs/goals/assura-rule-docs-lifecycle-dogfood-expansion.md
      historical:
        - docs/archive/**
      require_frontmatter_status:
        - .trellis/spec/assura/roadmap.md
        - docs/project-memories.md
        - docs/release-notes.md
        - docs/support-policy.md
        - docs/compatibility-and-surface.md
        - docs/release-candidate-checklist.md
        - docs/validation.md
        - docs/analysis/2026-06-09-assura-best-practice-target-state.md
        - docs/goals/assura-rule-docs-lifecycle-stale-claims.md
        - docs/goals/assura-rule-docs-lifecycle-dogfood-expansion.md
      allowed_statuses:
        - planned
        - active
        - completed
        - archived
        - historical
      claim_patterns:
        - id: docs_lifecycle_goal
          pattern: "docs-lifecycle"
          evidence_files:
            - docs/goals/assura-rule-docs-lifecycle-stale-claims.md
            - docs/goals/assura-rule-docs-lifecycle-dogfood-expansion.md
        - id: release_archive_linux_amd64
          pattern: "assura-linux-amd64.tar.gz"
          evidence_files:
            - .github/workflows/release.yml
            - docs/compatibility-and-surface.md
            - docs/release-notes.md
        - id: release_archive_linux_musl_amd64
          pattern: "assura-linux-musl-amd64.tar.gz"
          evidence_files:
            - .github/workflows/release.yml
            - docs/compatibility-and-surface.md
            - docs/release-notes.md
        - id: release_archive_macos_arm64
          pattern: "assura-macos-arm64.tar.gz"
          evidence_files:
            - .github/workflows/release.yml
            - docs/compatibility-and-surface.md
            - docs/release-notes.md
        - id: release_archive_macos_amd64
          pattern: "assura-macos-amd64.tar.gz"
          evidence_files:
            - .github/workflows/release.yml
            - docs/compatibility-and-surface.md
            - docs/release-notes.md
        - id: release_archive_windows_amd64
          pattern: "assura-windows-amd64.zip"
          evidence_files:
            - .github/workflows/release.yml
            - docs/compatibility-and-surface.md
            - docs/release-notes.md
        - id: performance_report_command
          pattern: "performance-report"
          evidence_files:
            - src/cli/performance_report/mod.rs
            - docs/support-policy.md
            - docs/release-notes.md
      historical_exceptions:
        - docs/archive/**
  support_matrices:
    - id: public_surface
      severity: high
      command_contracts:
        - .assura/command-surface.yml
      rust_exports:
        - src/lib.rs
      docs_claim_sources:
        - path: docs/compatibility-and-surface.md
      manifest_policies:
        - cargo_workspace
      entries:
        - surface: "command:assura"
          status: supported
        - surface: "command:assura check"
          status: supported
        - surface: "command:assura check --format json"
          status: supported
        - surface: "command:assura check --format yaml"
          status: supported
        - surface: "command:assura check --format advice"
          status: supported
        - surface: "command:assura check --format status"
          status: supported
        - surface: "command:assura check --format agent"
          status: supported
        - surface: "command:assura check --format agent --agent codex"
          status: supported
        - surface: "command:assura status"
          status: supported
        - surface: "command:assura status --format json"
          status: supported
        - surface: "command:assura init"
          status: supported
        - surface: "command:assura watch"
          status: experimental
        - surface: "command:assura migrate"
          status: supported
        - surface: "command:assura fix markdown"
          status: experimental
        - surface: "command:assura fix markdown --dry-run --format json"
          status: experimental
        - surface: "command:assura content"
          status: supported
        - surface: "command:assura content agent-context"
          status: supported
        - surface: "command:assura content agent-query"
          status: supported
        - surface: "command:assura content context-pack"
          status: supported
        - surface: "command:assura content collections"
          status: supported
        - surface: "command:assura content instances"
          status: supported
        - surface: "command:assura content show"
          status: supported
        - surface: "command:assura content search"
          status: supported
        - surface: "command:assura content semantic-search"
          status: supported
        - surface: "command:assura content symbols"
          status: supported
        - surface: "command:assura content symbol-refs"
          status: supported
        - surface: "command:assura content missing-relations"
          status: supported
        - surface: "command:assura content expand"
          status: supported
        - surface: "command:assura info"
          status: experimental
        - surface: "command:assura performance-report"
          status: supported
        - surface: "command:assura quality plan"
          status: supported
        - surface: "command:assura hooks"
          status: supported
        - surface: "command:assura hooks install"
          status: supported
        - surface: "command:assura hooks uninstall"
          status: supported
        - surface: "command:assura hooks status"
          status: supported
        - surface: "command:assura hooks verify"
          status: supported
        - surface: "rust:stable_hash"
          status: internal
        - surface: "rust:cli"
          status: supported
        - surface: "rust:config"
          status: supported
        - surface: "rust:content_repository"
          status: experimental
        - surface: "rust:constraints"
          status: experimental
        - surface: "rust:intelligence"
          status: internal
        - surface: "rust:markdown"
          status: experimental
        - surface: "rust:maturity"
          status: internal
        - surface: "rust:validation"
          status: internal
        - surface: "package:assura"
          status: supported
        - surface: "package:assura-check-cli"
          status: internal
        - surface: "package:assura-stable-hash"
          status: internal
        - surface: "package:xtask"
          status: internal
        - surface: "binary:assura"
          status: supported
        - surface: "binary:assura-full"
          status: internal
        - surface: "binary:assura-check"
          status: internal
        - surface: "binary:assura-checkd"
          status: internal
        - surface: "binary:assura-check-client"
          status: internal
        - surface: "binary:assura-check-session"
          status: internal
        - surface: "binary:assura-check-unix-client"
          status: internal
        - surface: "binary:assura-check-status"
          status: internal
        - surface: "binary:assura-check-noop"
          status: internal
        - surface: "binary:assura-check-compiled"
          status: internal
        - surface: "binary:assura-check-compile-config"
          status: internal
  custom_constraints:
    - id: command_surface_docs
      type: command_surface_docs
      source: "docs/*.md"
      target: ".assura/command-surface.yml"
      severity: high
    - id: command_surface_readme
      type: command_surface_docs
      source: "README.md"
      target: ".assura/command-surface.yml"
      severity: high
    - id: command_surface_website
      type: command_surface_docs
      source: "website/src/content/docs/**/*.mdx"
      target: ".assura/command-surface.yml"
      severity: high
    - id: command_surface_analysis
      type: command_surface_docs
      source: "docs/analysis/*.md"
      target: ".assura/command-surface.yml"
      severity: high
    - id: command_surface_goals
      type: command_surface_docs
      source: "docs/goals/*.md"
      target: ".assura/command-surface.yml"
      severity: high
    - id: command_surface_agents
      type: command_surface_docs
      source: "AGENTS.md"
      target: ".assura/command-surface.yml"
      severity: high
    - id: command_surface_skills
      type: command_surface_docs
      source: ".agents/**/*.md"
      target: ".assura/command-surface.yml"
      severity: high

models:
  source: .assura/project-intelligence-goals.linkml.yaml
  validation_artifact: .assura/project-intelligence-goals.schema.json

collections:
  assura_goals:
    class: AssuraGoal
    path: docs/goals/*.md
    adapter: markdown_frontmatter
    data: frontmatter
    body: markdown
    id: id

# Root directory - only standard project files allowed
# Special documents (AGENTS.md, CONSTITUTION.md) allowed in SCREAMING_SNAKE_CASE
# All other root files must be standard project files
structure:
  ./:
    files:
      # Standard project files are allowed
      allowed_names:
        # Core documentation (standard project files)
        - "README.md"
        - "CHANGELOG.md"
        - "CONTRIBUTING.md"
        - "CODE_OF_CONDUCT.md"
        - "SECURITY.md"
        # Special documents (exception to naming convention)
        - "AGENTS.md"
        - "CONSTITUTION.md"
        # License files
        - "LICENSE"
        - "LICENSE-MIT"
        - "LICENSE-APACHE"
        # Project/tooling manifests
        - ".gitignore"
        - "Cargo.lock"
        - "Cargo.toml"
        - "PROJECT_CONTEXT.md"
      # Required files that must exist in root
      required:
        - "README.md"
        - "AGENTS.md"
      naming: "PascalCase"
      allow_extra: false
    directories:
      allowed_names:
        - ".agents"
        - ".assura"
        - ".cargo"
        - ".codex"
        - ".github"
        - ".trellis"
        - "benches"
        - "crates"
        - "docs"
        - "integrations"
        - "scripts"
        - "src"
        - "tests"
        - "website"
        - "xtask"
      allow_extra: false
    
    # Subdirectories
    children:
      .agents/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "README.md"
            - "SKILL.md"
            - "TEMPLATE.md"
            - "prd.json"
          allow_extra: false
        directories:
          allowed_names:
            - "skills"
          allow_extra: false
        children:
          skills/:
            files:
              naming: "kebab-case"
              max_lines: 600
              max_size: "24KB"
              naming_patterns:
                "SKILL.md": "regex:^SKILL$"
              allowed_names:
                - "README.md"
                - "TEMPLATE.md"
              allow_extra: false
            directories:
              naming: "kebab-case"
              allowed_names:
                - "assura-goal-execution"
                - "assura-goal-validation"
                - "assura-local-build"
                - "assura-performance-reporting"
                - "built-in"
