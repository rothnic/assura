                - "trellis-before-dev"
                - "trellis-brainstorm"
                - "trellis-break-loop"
                - "trellis-check"
                - "trellis-continue"
                - "trellis-finish-work"
                - "trellis-meta"
                - "trellis-start"
                - "trellis-update-spec"
              allow_extra: false
            children:
              assura-goal-execution/:
                files:
                  naming: "kebab-case"
                  naming_patterns:
                    "SKILL.md": "regex:^SKILL$"
