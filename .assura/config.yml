version: "2.0"

project:
  name: "assura"
  description: "Dependency-aware file system validation engine"

# Root directory - only standard project files allowed
# Special documents (AGENTS.md, CONSTITUTION.md) allowed in SCREAMING_SNAKE_CASE
# All other root files must be standard project files
structure:
  ./:
    files:
      # Standard project files are allowed
      allowed_names:
        # Core documentation (standard project files)
        - "README.md"
        - "CHANGELOG.md"
        - "CONTRIBUTING.md"
        - "CODE_OF_CONDUCT.md"
        - "SECURITY.md"
        # Special documents (exception to naming convention)
        - "AGENTS.md"
        - "CONSTITUTION.md"
        # License files
        - "LICENSE"
        - "LICENSE-MIT"
        - "LICENSE-APACHE"
        # Project/tooling manifests
        - ".gitignore"
        - "Cargo.toml"
        - "package.json"
        - "PROJECT_CONTEXT.md"
      # Required files that must exist in root
      required:
        - "README.md"
        - "AGENTS.md"
      naming: "PascalCase"
    
    # Subdirectories
    children:
      .agents/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "README.md"
            - "SKILL.md"
            - "TEMPLATE.md"
      
      .assura/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "config.new.yml"
            - "config.yml"
            - "config.yml.v1"
        children:
          hooks/:
            files:
              naming: "kebab-case"

      .codex/:
        files:
          naming: "kebab-case"
        children:
          agents/:
            files:
              naming: "kebab-case"
          hooks/:
            files:
              naming: "kebab-case"
      
      .github/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "PULL_REQUEST_TEMPLATE.md"
        children:
          ISSUE_TEMPLATE/:
            files:
              naming: "snake_case"
          prompts/:
            files:
              naming: "kebab-case"
          skills/:
            files:
              naming: "kebab-case"
              allowed_names:
                - "SKILL.md"
          workflows/:
            files:
              naming: "kebab-case"
      
      benches/:
        files:
          naming: "snake_case"
          max_lines: 1200
          allowed_names:
            - "README.md"
      
      docs/:
        files:
          naming: "kebab-case"
          max_lines: 500
        markdown:
          require_frontmatter: true
      
      opencode-plugin/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "README.md"
      
      src/:
        files:
          naming: "snake_case"
          max_lines: 500
          require_docs: true
        children:
          cli/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          config/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          constraints/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          intelligence/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          ls_compat/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          markdown/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          maturity/:
            files:
              naming: "snake_case"
              max_lines: 500
          
          validation/:
            files:
              naming: "snake_case"
              max_lines: 500
      
      .trellis/:
        files:
          naming: "kebab-case"
          max_lines: 2000
          allowed_names:
            - ".gitignore"
            - ".template-hashes.json"
            - ".version"
        children:
          scripts/:
            files:
              naming: "snake_case"
              max_lines: 1000
              allowed_names:
                - "__init__.py"
          spec/:
            files:
              naming: "kebab-case"
              max_lines: 1000
            markdown:
              require_frontmatter: false
          tasks/:
            files:
              naming: "kebab-case"
              max_lines: 1000
            markdown:
              require_frontmatter: false
          workspace/:
            files:
              naming: "kebab-case"
              max_lines: 1000
            markdown:
              require_frontmatter: false
      
      tests/:
        files:
          naming: "snake_case"
          max_lines: 1000
      
      website/:
        files:
          naming: "kebab-case"
          allowed_names:
            - "README.md"

# Global exclusions
exclude:
  - "target/**"
  - ".git/**"
  - ".trellis/.developer"
  - ".trellis/.runtime/**"
  - "**/__pycache__"
  - "**/__pycache__/**"
  - "node_modules/**"
  - ".astro/**"
  - "dist/**"
  - "*.lock"
