[package]
name = "assura-check-cli"
version = "0.4.0"
edition = "2021"
description = "Internal low-latency Assura structure-check support binaries"
license = "MIT OR Apache-2.0"
rust-version = "1.86.0"
publish = false

[features]
default = []
full-cli = ["assura/full-cli"]

[[bin]]
name = "assura-check"
path = "src/main.rs"

[[bin]]
name = "assura-checkd"
path = "src/server.rs"

[[bin]]
name = "assura-check-client"
path = "src/client.rs"

[[bin]]
name = "assura-check-session"
path = "src/session.rs"

[[bin]]
name = "assura-check-unix-client"
path = "src/unix_client.rs"
test = false

[[bin]]
name = "assura-check-status"
path = "src/status.rs"
test = false

[[bin]]
name = "assura-check-noop"
path = "src/noop.rs"
test = false

[[bin]]
name = "assura-check-compiled"
path = "src/compiled.rs"

[[bin]]
name = "assura-check-compile-config"
path = "src/compile_config.rs"

[dependencies]
assura = { path = "../..", default-features = false, features = ["json-output", "yaml-config"] }
assura-stable-hash = { path = "../assura-stable-hash" }
assura-watch-state = { path = "../assura-watch-state" }
lexopt = "0.3.2"
notify = "6.0"
pico-args = "0.5"
postcard = { version = "1.1", features = ["alloc"], default-features = false }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.0"
