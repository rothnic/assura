name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
    - name: Check
      run: cargo check --all-targets --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Enforce formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
    - name: Lint with clippy (advisory)
      id: clippy
      continue-on-error: true
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Summarize clippy baseline
      if: steps.clippy.outcome == 'failure'
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
        ## Clippy

        Clippy is currently advisory while the repository-wide warning baseline
        is cleaned up in a dedicated follow-up task. The check still runs with
        `-D warnings` so new output stays visible in CI logs.

        See `.trellis/spec/assura/tooling-stabilization.md` for the deferred
        baseline policy and close criteria.
        EOF

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows is temporarily paused while the pre-1.0 tooling baseline is
        # stabilized. The current failure is a libgit2-sys/MSVC linker issue,
        # not a product behavior regression. Re-enable after the deferred item
        # in .trellis/spec/assura/tooling-stabilization.md is resolved.
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
    - name: Run tests
      run: cargo test --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
    - name: Install tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Generate coverage
      run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml
    - name: Summarize coverage
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import xml.etree.ElementTree as ET

        root = ET.parse("cobertura.xml").getroot()
        line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
        branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100

        print("## Coverage")
        print()
        print(f"- Line coverage: {line_rate:.2f}%")
        print(f"- Branch coverage: {branch_rate:.2f}%")
        print("- Full Cobertura XML report is attached as a workflow artifact.")
        PY
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-cobertura
        path: ./cobertura.xml
        if-no-files-found: error
        retention-days: 14
