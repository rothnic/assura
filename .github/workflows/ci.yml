name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  ASSURA_MAX_RELEASE_ARCHIVE_BYTES: 8388608
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: CI Scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      release: ${{ steps.scope.outputs.release }}
      performance: ${{ steps.scope.outputs.performance }}
      evidence: ${{ steps.scope.outputs.evidence }}
      website: ${{ steps.scope.outputs.website }}
      scope_mode: ${{ steps.scope.outputs.scope_mode }}
      scope_reason: ${{ steps.scope.outputs.scope_reason }}
      full_rust: ${{ steps.scope.outputs.full_rust }}
      full_release: ${{ steps.scope.outputs.full_release }}
      full_performance: ${{ steps.scope.outputs.full_performance }}
      full_evidence: ${{ steps.scope.outputs.full_evidence }}
      full_website: ${{ steps.scope.outputs.full_website }}
      delta_rust: ${{ steps.scope.outputs.delta_rust }}
      delta_release: ${{ steps.scope.outputs.delta_release }}
      delta_performance: ${{ steps.scope.outputs.delta_performance }}
      delta_evidence: ${{ steps.scope.outputs.delta_evidence }}
      delta_website: ${{ steps.scope.outputs.delta_website }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Classify changed paths
      id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/ci-scope-github.sh
    - name: Summarize CI scope decision
      shell: bash
      run: |
        cat <<'MD' >> "$GITHUB_STEP_SUMMARY"
        ## CI Scope Decision

        | Scope | Effective | Full PR/Push | Delta |
        | --- | --- | --- | --- |
        | Mode | `${{ steps.scope.outputs.scope_mode }}` | `full` | `delta` |
        | Reason | `${{ steps.scope.outputs.scope_reason }}` |  |  |
        | Rust | `${{ steps.scope.outputs.rust }}` | `${{ steps.scope.outputs.full_rust }}` | `${{ steps.scope.outputs.delta_rust }}` |
        | Release | `${{ steps.scope.outputs.release }}` | `${{ steps.scope.outputs.full_release }}` | `${{ steps.scope.outputs.delta_release }}` |
        | Performance | `${{ steps.scope.outputs.performance }}` | `${{ steps.scope.outputs.full_performance }}` | `${{ steps.scope.outputs.delta_performance }}` |
        | Evidence | `${{ steps.scope.outputs.evidence }}` | `${{ steps.scope.outputs.full_evidence }}` | `${{ steps.scope.outputs.delta_evidence }}` |
        | Website | `${{ steps.scope.outputs.website }}` | `${{ steps.scope.outputs.full_website }}` | `${{ steps.scope.outputs.delta_website }}` |

        Pull request synchronize events use the commit delta as the effective
        scope only when skipped full-scope jobs already passed on the previous
        PR head. Opened/reopened PRs, pushes, schedules, workflow/classifier
        changes, unavailable delta state, and missing previous-head evidence
        fall back to full scope.
        MD

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-debug-${{ runner.os }}-stable
        cache-all-crates: true
    - name: Summarize Rust cache
      run: bash scripts/summarize-rust-cache.sh "Check" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-debug-${{ runner.os }}-stable"
    - name: Check
      run: cargo check --all-targets --all-features

  msrv:
    name: MSRV (Rust 1.86.0)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install declared MSRV
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.86.0
    - name: Check default workspace targets
      run: cargo check --locked --workspace --all-targets
    - name: Build minimal public launcher
      run: cargo build --locked --bin assura --no-default-features --features json-output,yaml-config

  evidence:
    name: Evidence Gates
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-debug-${{ runner.os }}-stable
        cache-all-crates: true
    - name: Summarize Rust cache
      run: bash scripts/summarize-rust-cache.sh "Evidence Gates" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-debug-${{ runner.os }}-stable"
    - name: Verify Assura project structure
      run: cargo run --quiet -- check --format json .
    - name: Verify review evidence policy
      run: cargo xtask evidence

  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Enforce formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-debug-${{ runner.os }}-stable
        cache-all-crates: true
    - name: Summarize Rust cache
      run: bash scripts/summarize-rust-cache.sh "Clippy" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-debug-${{ runner.os }}-stable"
    - name: Lint with clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-debug-${{ runner.os }}-${{ matrix.rust }}
        cache-all-crates: true
    - name: Summarize Rust cache
      run: bash scripts/summarize-rust-cache.sh "Test Suite" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-debug-${{ runner.os }}-${{ matrix.rust }}"
    - name: Run tests
      run: cargo test --all-features
    - name: Capture watch scope normalization evidence
      env:
        ASSURA_WATCH_NORMALIZATION_DEBUG: "1"
      run: cargo test --all-features --test watch_cli watch_honors_the_requested_directory_scope -- --exact --nocapture

  release-bundle:
    name: Release Bundle Smoke
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-release-${{ runner.os }}-host
        cache-all-crates: true
    - name: Summarize Rust cache
      run: bash scripts/summarize-rust-cache.sh "Release Bundle Smoke" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-release-${{ runner.os }}-host"
    - name: Build installable bundle
      run: |
        cargo rustc --release --bin assura --no-default-features --features json-output,yaml-config -- -C target-feature=+crt-static -C link-arg=-lgcc_eh
        cargo build --release --bin assura-full
        mkdir -p target/release-bundle
        cp target/release/assura target/release/assura-full target/release-bundle/
        tar -C target/release-bundle -czf target/assura-linux-amd64-preview.tar.gz assura assura-full
    - name: Enforce release archive size
      run: |
        bytes="$(wc -c < target/assura-linux-amd64-preview.tar.gz | tr -d '[:space:]')"
        echo "assura-linux-amd64-preview.tar.gz: ${bytes} bytes"
        test "$bytes" -le "$ASSURA_MAX_RELEASE_ARCHIVE_BYTES"
    - name: Smoke Unix installer
      run: |
        tmp="$(mktemp -d)"
        ASSURA_ASSET_URL="$PWD/target/assura-linux-amd64-preview.tar.gz" BIN_DIR="$tmp/bin" ./website/public/install.sh
        "$tmp/bin/assura" --version
        "$tmp/bin/assura" --help >/tmp/assura-help.txt
        grep -q "Usage: assura" /tmp/assura-help.txt
        ASSURA_BIN="$tmp/bin/assura" ASSURA_SMOKE_DIR="$PWD/target/adoption-smoke/release-bundle" ./scripts/smoke-install-adoption.sh
    - name: Upload preview bundle
      uses: actions/upload-artifact@v4
      with:
        name: assura-linux-amd64-preview
        path: target/assura-linux-amd64-preview.tar.gz
        if-no-files-found: error
        retention-days: 14

  windows-installer:
    name: Windows Installer Smoke
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-release-${{ runner.os }}-host
        cache-all-crates: true
    - name: Summarize Rust cache
      shell: bash
      run: bash scripts/summarize-rust-cache.sh "Windows Installer Smoke" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-release-${{ runner.os }}-host"
    - name: Build installable Windows bundle
      shell: pwsh
      run: |
        cargo build --release --bin assura --no-default-features --features json-output,yaml-config
        cargo build --release --bin assura-full
        New-Item -ItemType Directory -Force -Path target/release-bundle | Out-Null
        Copy-Item target/release/assura.exe target/release-bundle/assura.exe
        Copy-Item target/release/assura-full.exe target/release-bundle/assura-full.exe
        Compress-Archive -Path target/release-bundle/* -DestinationPath target/assura-windows-amd64.zip -Force
    - name: Enforce release archive size
      shell: pwsh
      run: |
        $bytes = (Get-Item target/assura-windows-amd64.zip).Length
        Write-Host "assura-windows-amd64.zip: $bytes bytes"
        if ($bytes -gt [int64]$env:ASSURA_MAX_RELEASE_ARCHIVE_BYTES) {
          throw "Release archive exceeds size budget"
        }
    - name: Smoke PowerShell installer
      shell: pwsh
      run: |
        $bin = Join-Path $env:RUNNER_TEMP "assura-bin"
        ./website/public/install.ps1 -AssetUrl (Resolve-Path target/assura-windows-amd64.zip) -BinDir $bin
        & (Join-Path $bin "assura.exe") --version
        & (Join-Path $bin "assura.exe") --help | Select-String "Usage: assura"
        ./scripts/smoke-install-adoption.ps1 `
          -AssuraBin (Join-Path $bin "assura.exe") `
          -WorkRoot (Join-Path (Resolve-Path target) "adoption-smoke/windows-installer")

  installable-adoption:
    name: Installable Adoption Smoke (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: assura-linux-amd64.tar.gz
            archive_kind: tar
          - label: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive_name: assura-macos-arm64.tar.gz
            archive_kind: tar
          - label: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive_name: assura-macos-amd64.tar.gz
            archive_kind: tar
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: assura-windows-amd64.zip
            archive_kind: zip
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-release-${{ runner.os }}-${{ matrix.target }}
        cache-all-crates: true
    - name: Summarize Rust cache
      shell: bash
      run: bash scripts/summarize-rust-cache.sh "Installable Adoption Smoke (${{ matrix.label }})" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-release-${{ runner.os }}-${{ matrix.target }}"
    - name: Build release-style archive (Unix)
      if: matrix.archive_kind == 'tar'
      shell: bash
      run: |
        if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
          cargo rustc --release --target ${{ matrix.target }} --bin assura --no-default-features --features json-output,yaml-config -- -C target-feature=+crt-static -C link-arg=-lgcc_eh
        else
          cargo build --release --target ${{ matrix.target }} --bin assura --no-default-features --features json-output,yaml-config
        fi
        cargo build --release --target ${{ matrix.target }} --bin assura-full
        mkdir -p target/release-bundle/${{ matrix.label }}
        cp target/${{ matrix.target }}/release/assura target/${{ matrix.target }}/release/assura-full target/release-bundle/${{ matrix.label }}/
        tar -C target/release-bundle/${{ matrix.label }} -czf target/${{ matrix.archive_name }} assura assura-full
    - name: Build release-style archive (Windows)
      if: matrix.archive_kind == 'zip'
      shell: pwsh
      run: |
        cargo build --release --target ${{ matrix.target }} --bin assura --no-default-features --features json-output,yaml-config
        cargo build --release --target ${{ matrix.target }} --bin assura-full
        New-Item -ItemType Directory -Force -Path target/release-bundle/${{ matrix.label }} | Out-Null
        Copy-Item target/${{ matrix.target }}/release/assura.exe target/release-bundle/${{ matrix.label }}/assura.exe
        Copy-Item target/${{ matrix.target }}/release/assura-full.exe target/release-bundle/${{ matrix.label }}/assura-full.exe
        Compress-Archive -Path target/release-bundle/${{ matrix.label }}/* -DestinationPath target/${{ matrix.archive_name }} -Force
    - name: Enforce release archive size (Unix)
      if: matrix.archive_kind == 'tar'
      shell: bash
      run: |
        bytes="$(wc -c < target/${{ matrix.archive_name }} | tr -d '[:space:]')"
        echo "${{ matrix.archive_name }}: ${bytes} bytes"
        test "$bytes" -le "$ASSURA_MAX_RELEASE_ARCHIVE_BYTES"
    - name: Enforce release archive size (Windows)
      if: matrix.archive_kind == 'zip'
      shell: pwsh
      run: |
        $bytes = (Get-Item target/${{ matrix.archive_name }}).Length
        Write-Host "${{ matrix.archive_name }}: $bytes bytes"
        if ($bytes -gt [int64]$env:ASSURA_MAX_RELEASE_ARCHIVE_BYTES) {
          throw "Release archive exceeds size budget"
        }
    - name: Generate and verify checksum (Unix)
      if: matrix.archive_kind == 'tar'
      shell: bash
      run: |
        cd target
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256
          sha256sum -c ${{ matrix.archive_name }}.sha256
        else
          shasum -a 256 ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256
          shasum -a 256 -c ${{ matrix.archive_name }}.sha256
        fi
    - name: Generate and verify checksum (Windows)
      if: matrix.archive_kind == 'zip'
      shell: pwsh
      run: |
        Push-Location target
        $archive = "${{ matrix.archive_name }}"
        $checksum = "$archive.sha256"
        $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  $archive" | Set-Content -NoNewline $checksum
        $recorded = (Get-Content $checksum).Split(" ")[0]
        if ($recorded -ne $hash) {
          throw "Checksum verification failed for $archive"
        }
        Pop-Location
    - name: Smoke installed archive (Unix)
      if: matrix.archive_kind == 'tar'
      shell: bash
      run: |
        tmp="$(mktemp -d)"
        ASSURA_ASSET_URL="$PWD/target/${{ matrix.archive_name }}" BIN_DIR="$tmp/bin" ./website/public/install.sh
        ASSURA_BIN="$tmp/bin/assura" ASSURA_SMOKE_DIR="$PWD/target/adoption-smoke/${{ matrix.label }}" ./scripts/smoke-install-adoption.sh
    - name: Smoke installed archive (Windows)
      if: matrix.archive_kind == 'zip'
      shell: pwsh
      run: |
        $bin = Join-Path $env:RUNNER_TEMP "assura-${{ matrix.label }}-bin"
        ./website/public/install.ps1 -AssetUrl (Resolve-Path target/${{ matrix.archive_name }}) -BinDir $bin
        ./scripts/smoke-install-adoption.ps1 `
          -AssuraBin (Join-Path $bin "assura.exe") `
          -WorkRoot (Join-Path (Resolve-Path target) "adoption-smoke/${{ matrix.label }}")
    - name: Upload adoption smoke evidence
      uses: actions/upload-artifact@v4
      with:
        name: adoption-smoke-${{ matrix.label }}
        path: target/adoption-smoke/${{ matrix.label }}
        if-no-files-found: error
        retention-days: 14
    - name: Upload release-style archive
      uses: actions/upload-artifact@v4
      with:
        name: adoption-archive-${{ matrix.label }}
        path: |
          target/${{ matrix.archive_name }}
          target/${{ matrix.archive_name }}.sha256
        if-no-files-found: error
        retention-days: 14

  coverage:
    name: Code Coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-debug-${{ runner.os }}-stable
        cache-all-crates: true
    - name: Summarize Rust cache
      run: bash scripts/summarize-rust-cache.sh "Code Coverage" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-debug-${{ runner.os }}-stable"
    - name: Install tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Generate coverage
      run: >
        cargo tarpaulin --verbose --all-features --workspace --lib --timeout 120 --out xml
    - name: Summarize coverage
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import xml.etree.ElementTree as ET

        root = ET.parse("cobertura.xml").getroot()
        line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
        branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100

        print("## Coverage")
        print()
        print(f"- Line coverage: {line_rate:.2f}%")
        print(f"- Branch coverage: {branch_rate:.2f}%")
        print("- Full Cobertura XML report is attached as a workflow artifact.")
        PY
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-cobertura
        path: ./cobertura.xml
        if-no-files-found: error
        retention-days: 14

  performance:
    name: Performance Report
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-release-${{ runner.os }}-host
        cache-all-crates: true
    - name: Summarize Rust cache
      run: bash scripts/summarize-rust-cache.sh "Performance Report" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-release-${{ runner.os }}-host"
    - name: Build release performance bundle
      id: perf_build
      run: |
        cargo build --release --bin assura --no-default-features --features json-output,yaml-config
        cargo rustc --release --bin assura --no-default-features --features json-output,yaml-config -- -C target-feature=+crt-static -C link-arg=-lgcc_eh
        cargo build --release --bin assura-full
        cargo build --release -p assura-check-cli
    - name: Generate comparison report
      id: perf_lslint_generate
      if: ${{ !cancelled() && steps.perf_build.outcome == 'success' }}
      run: |
        mkdir -p target/performance
        target/release/assura performance-report \
          --output target/performance/ls-lint-comparison.json \
          --iterations 16
    - name: Enforce no-slower gate
      id: perf_lslint_gate
      if: ${{ !cancelled() && steps.perf_lslint_generate.outcome == 'success' }}
      run: cargo xtask performance-no-slower target/performance/ls-lint-comparison.json
    - name: Generate native performance report
      id: perf_native_generate
      if: ${{ !cancelled() && steps.perf_build.outcome == 'success' }}
      run: |
        target/release/assura performance-report \
          --suite native \
          --output target/performance/native-current.json \
          --history target/performance/native-history.jsonl \
          --iterations 5
    - name: Enforce native performance gate
      id: perf_native_gate
      if: ${{ !cancelled() && steps.perf_native_generate.outcome == 'success' }}
      run: cargo xtask native-performance-no-regression target/performance/native-current.json
    - name: Generate warm-loop performance report
      id: perf_warm_generate
      if: ${{ !cancelled() && steps.perf_build.outcome == 'success' }}
      run: |
        cargo xtask warm-loop-benchmark \
          --binary target/release/assura-full \
          --iterations 20 \
          --output target/performance/warm-loop-current.json \
          --history target/performance/warm-loop-history.jsonl
    - name: Validate checked warm-loop contract
      id: perf_warm_checked_gate
      if: ${{ !cancelled() && steps.perf_build.outcome == 'success' }}
      run: cargo xtask warm-loop-no-regression benches/history/warm-loop-current.json
    - name: Enforce warm-loop p95 budgets
      id: perf_warm_gate
      if: ${{ !cancelled() && steps.perf_warm_generate.outcome == 'success' }}
      run: cargo xtask warm-loop-no-regression target/performance/warm-loop-current.json
    - name: Summarize performance
      if: ${{ !cancelled() }}
      env:
        PERF_BUILD_OUTCOME: ${{ steps.perf_build.outcome }}
        PERF_LSLINT_GENERATE_OUTCOME: ${{ steps.perf_lslint_generate.outcome }}
        PERF_LSLINT_GATE_OUTCOME: ${{ steps.perf_lslint_gate.outcome }}
        PERF_NATIVE_GENERATE_OUTCOME: ${{ steps.perf_native_generate.outcome }}
        PERF_NATIVE_GATE_OUTCOME: ${{ steps.perf_native_gate.outcome }}
        PERF_WARM_GENERATE_OUTCOME: ${{ steps.perf_warm_generate.outcome }}
        PERF_WARM_CHECKED_GATE_OUTCOME: ${{ steps.perf_warm_checked_gate.outcome }}
        PERF_WARM_GATE_OUTCOME: ${{ steps.perf_warm_gate.outcome }}
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json
        import os
        from pathlib import Path

        outcomes = {
            "build": os.environ.get("PERF_BUILD_OUTCOME", "unknown"),
            "ls_lint_generation": os.environ.get("PERF_LSLINT_GENERATE_OUTCOME", "unknown"),
            "ls_lint_gate": os.environ.get("PERF_LSLINT_GATE_OUTCOME", "unknown"),
            "native_generation": os.environ.get("PERF_NATIVE_GENERATE_OUTCOME", "unknown"),
            "native_gate": os.environ.get("PERF_NATIVE_GATE_OUTCOME", "unknown"),
            "warm_generation": os.environ.get("PERF_WARM_GENERATE_OUTCOME", "unknown"),
            "warm_checked_gate": os.environ.get("PERF_WARM_CHECKED_GATE_OUTCOME", "unknown"),
            "warm_gate": os.environ.get("PERF_WARM_GATE_OUTCOME", "unknown"),
        }

        def evidence_status(generation):
            if outcomes["build"] != "success":
                return "not_run_build_failed"
            if outcomes[generation] != "success":
                return "generation_failed"
            return "generated"

        def median(row):
            value = row["median_runtime_ms"]
            return "n/a" if value is None else f"{value:.3f} ms"

        print("## Performance Evidence Status")
        print()
        for label, generation, gates in [
            ("LS-Lint comparison", "ls_lint_generation", [("no-slower", "ls_lint_gate")]),
            ("Native", "native_generation", [("native regression", "native_gate")]),
            ("Warm loop", "warm_generation", [
                ("checked contract", "warm_checked_gate"),
                ("p95 budget", "warm_gate"),
            ]),
        ]:
            gate_outcomes = ", ".join(
                f"{name} `{outcomes[gate]}`" for name, gate in gates
            )
            print(
                f"- {label}: `{evidence_status(generation)}` "
                f"(generation `{outcomes[generation]}`, {gate_outcomes})"
            )
        print()

        def summarize_lslint(report):
            print("## Assura vs LS-Lint Performance")
            print()
            print(f"- Baseline: `{report['comparison_baseline_id']}`")
            print(f"- Commit: `{report['commit_sha']}`")
            print(f"- Branch: `{report['branch']}`")
            environment = report["environment"]
            print(f"- Environment: `{environment['os']}/{environment['arch']}`")
            print(f"- Rust: `{environment['rust_version']}`")
            print(f"- Node/npm: `{environment['node_version']}` / `{environment['npm_version']}`")
            status = report["ls_lint_status"]
            if status["available"]:
                print(f"- LS-Lint: `{status['version']}`")
            else:
                print(f"- LS-Lint: skipped, `{status['blocker']}`")
            print("- Full machine-readable report is attached as `ls-lint-performance-report`.")
            print()
            print("| Fixture | Assura median | LS-Lint median | Status |")
            print("| --- | ---: | ---: | --- |")
            rows = report["results"]
            def row_name(row):
                return row.get("row_family") or row["tool_name"]
            def find_row(fixture, *names):
                return next(row for row in rows if row["fixture_id"] == fixture and row_name(row) in names)
            fixtures = []
            for row in rows:
                if row["fixture_id"] not in fixtures:
                    fixtures.append(row["fixture_id"])
            for fixture in fixtures:
                assura = find_row(fixture, "assura-cli")
                lslint = find_row(fixture, "ls-lint-cli")
                print(f"| `{fixture}` | {median(assura)} | {median(lslint)} | `{assura['status']}` / `{lslint['status']}` |")
            print()
            print("## jwalk Migration Traversal Evidence")
            print()
            print("| Fixture | walkdir | jwalk serial | jwalk parallel | Status |")
            print("| --- | ---: | ---: | ---: | --- |")
            for fixture in fixtures:
                walkdir = find_row(fixture, "traversal:walkdir", "walkdir")
                serial = find_row(fixture, "traversal:jwalk-serial", "jwalk-serial")
                parallel = find_row(fixture, "traversal:jwalk-parallel", "jwalk-parallel")
                print(f"| `{fixture}` | {median(walkdir)} | {median(serial)} | {median(parallel)} | `{walkdir['status']}` / `{serial['status']}` / `{parallel['status']}` |")
            print()
            print("## Assura Phase Breakdown")
            print()
            print("| Fixture | Config discovery | Config load | Init | Configured rules | Walk + validate | Sort |")
            print("| --- | ---: | ---: | ---: | ---: | ---: | ---: |")
            phases = [
                "assura:phase:config-discovery",
                "assura:phase:config-load",
                "assura:phase:checker-init",
                "assura:phase:configured-structure",
                "assura:phase:walk-and-validate",
                "assura:phase:report-sort",
            ]
            for fixture in fixtures:
                values = [
                    median(find_row(fixture, phase))
                    for phase in phases
                ]
                print(f"| `{fixture}` | " + " | ".join(values) + " |")

        report_path = Path("target/performance/ls-lint-comparison.json")
        if report_path.exists():
            summarize_lslint(json.loads(report_path.read_text()))

        native_path = Path("target/performance/native-current.json")
        if native_path.exists():
            native = json.loads(native_path.read_text())
            native_rows = native["results"]
            print()
            print("## Assura Native Performance")
            print()
            print(f"- Rows: `{len(native_rows)}`")
            print(f"- Commit: `{native['commit_sha']}`")
            print(f"- Source dirty: `{native['source_worktree_dirty']}`")
            print("- Full machine-readable native report is attached as `native-performance-report`.")
            print()
            print("| Fixture | Rows | Slowest median |")
            print("| --- | ---: | ---: |")
            for fixture in sorted({row["fixture_id"] for row in native_rows}):
                fixture_rows = [row for row in native_rows if row["fixture_id"] == fixture]
                slowest = max(
                    fixture_rows,
                    key=lambda row: row["median_runtime_ms"] or 0,
                )
                print(f"| `{fixture}` | {len(fixture_rows)} | {median(slowest)} `{slowest['row_family']}` |")

        warm_loop_path = Path("target/performance/warm-loop-current.json")
        if warm_loop_path.exists():
            warm_loop = json.loads(warm_loop_path.read_text())
            print()
            print("## Agent Warm-Loop Performance")
            print()
            print("| Scenario | Median | p95 | Budget | Result |")
            print("| --- | ---: | ---: | ---: | --- |")
            for row in warm_loop["rows"]:
                result = "pass" if row["within_budget"] else "fail"
                print(
                    f"| `{row['id']}` | {row['median_ms']:.3f} ms | "
                    f"{row['p95_ms']:.3f} ms | {row['budget_ms']:.3f} ms | `{result}` |"
                )
        PY
    - name: Upload performance artifact
      if: ${{ !cancelled() && steps.perf_lslint_generate.outcome == 'success' && hashFiles('target/performance/ls-lint-comparison.json') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ls-lint-performance-report
        path: target/performance/ls-lint-comparison.json
        if-no-files-found: error
        retention-days: 30
    - name: Upload native performance artifact
      if: ${{ !cancelled() && steps.perf_native_generate.outcome == 'success' && hashFiles('target/performance/native-current.json') != '' && hashFiles('target/performance/native-history.jsonl') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: native-performance-report
        path: |
          target/performance/native-current.json
          target/performance/native-history.jsonl
        if-no-files-found: error
        retention-days: 30
    - name: Upload warm-loop performance artifact
      if: ${{ !cancelled() && steps.perf_warm_generate.outcome == 'success' && hashFiles('target/performance/warm-loop-current.json') != '' && hashFiles('target/performance/warm-loop-history.jsonl') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: warm-loop-performance-report
        path: |
          target/performance/warm-loop-current.json
          target/performance/warm-loop-history.jsonl
        if-no-files-found: error
        retention-days: 30
