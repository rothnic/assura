name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
    - name: Check
      run: cargo check --all-targets --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Enforce formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
    - name: Lint with clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows is temporarily paused while the pre-1.0 tooling baseline is
        # stabilized. The current failure is a libgit2-sys/MSVC linker issue,
        # not a product behavior regression. Re-enable after the deferred item
        # in .trellis/spec/assura/tooling-stabilization.md is resolved.
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
    - name: Run tests
      run: cargo test --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
    - name: Install tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Generate coverage
      run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml
    - name: Summarize coverage
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import xml.etree.ElementTree as ET

        root = ET.parse("cobertura.xml").getroot()
        line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
        branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100

        print("## Coverage")
        print()
        print(f"- Line coverage: {line_rate:.2f}%")
        print(f"- Branch coverage: {branch_rate:.2f}%")
        print("- Full Cobertura XML report is attached as a workflow artifact.")
        PY
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-cobertura
        path: ./cobertura.xml
        if-no-files-found: error
        retention-days: 14

  performance:
    name: Performance Report
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
    - name: Generate comparison report
      run: |
        mkdir -p target/performance
        cargo run --quiet -- performance-report \
          --output target/performance/ls-lint-comparison.json \
          --iterations 3
    - name: Summarize performance
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json
        from pathlib import Path

        report_path = Path("target/performance/ls-lint-comparison.json")
        report = json.loads(report_path.read_text())
        print("## Assura vs LS-Lint Performance")
        print()
        print(f"- Baseline: `{report['comparison_baseline_id']}`")
        print(f"- Commit: `{report['commit_sha']}`")
        print(f"- Branch: `{report['branch']}`")
        environment = report["environment"]
        print(f"- Environment: `{environment['os']}/{environment['arch']}`")
        print(f"- Rust: `{environment['rust_version']}`")
        print(f"- Node/npm: `{environment['node_version']}` / `{environment['npm_version']}`")
        status = report["ls_lint_status"]
        if status["available"]:
            print(f"- LS-Lint: `{status['version']}`")
        else:
            print(f"- LS-Lint: skipped, `{status['blocker']}`")
        print("- Full machine-readable report is attached as `ls-lint-performance-report`.")
        print()
        print("| Fixture | Assura median | LS-Lint median | Status |")
        print("| --- | ---: | ---: | --- |")
        rows = report["results"]
        fixtures = []
        for row in rows:
            if row["fixture_id"] not in fixtures:
                fixtures.append(row["fixture_id"])
        for fixture in fixtures:
            assura = next(row for row in rows if row["fixture_id"] == fixture and row["tool_name"] == "assura")
            lslint = next(row for row in rows if row["fixture_id"] == fixture and row["tool_name"] == "ls-lint")
            def median(row):
                value = row["median_runtime_ms"]
                return "n/a" if value is None else f"{value:.3f} ms"
            print(f"| `{fixture}` | {median(assura)} | {median(lslint)} | `{assura['status']}` / `{lslint['status']}` |")
        print()
        print("## jwalk Migration Traversal Evidence")
        print()
        print("| Fixture | walkdir | jwalk serial | jwalk parallel | Status |")
        print("| --- | ---: | ---: | ---: | --- |")
        for fixture in fixtures:
            walkdir = next(row for row in rows if row["fixture_id"] == fixture and row["tool_name"] == "walkdir")
            serial = next(row for row in rows if row["fixture_id"] == fixture and row["tool_name"] == "jwalk-serial")
            parallel = next(row for row in rows if row["fixture_id"] == fixture and row["tool_name"] == "jwalk-parallel")
            print(f"| `{fixture}` | {median(walkdir)} | {median(serial)} | {median(parallel)} | `{walkdir['status']}` / `{serial['status']}` / `{parallel['status']}` |")
        print()
        print("## Assura Phase Breakdown")
        print()
        print("| Fixture | Config discovery | Config load | Init | Configured rules | Walk + validate | Sort |")
        print("| --- | ---: | ---: | ---: | ---: | ---: | ---: |")
        phases = [
            "assura:config-discovery",
            "assura:config-load",
            "assura:checker-init",
            "assura:configured-structure",
            "assura:walk-and-validate",
            "assura:report-sort",
        ]
        for fixture in fixtures:
            values = [
                median(next(row for row in rows if row["fixture_id"] == fixture and row["tool_name"] == phase))
                for phase in phases
            ]
            print(f"| `{fixture}` | " + " | ".join(values) + " |")
        PY
    - name: Upload performance artifact
      uses: actions/upload-artifact@v4
      with:
        name: ls-lint-performance-report
        path: target/performance/ls-lint-comparison.json
        if-no-files-found: error
        retention-days: 30
