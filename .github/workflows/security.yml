name: Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Security Scope
    runs-on: ubuntu-latest
    outputs:
      security: ${{ steps.scope.outputs.security }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Classify changed paths
      id: scope
      shell: bash
      run: |
        case "${{ github.event_name }}" in
          pull_request)
            scripts/ci-scope.sh \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --merge-base
            ;;
          push)
            scripts/ci-scope.sh \
              --base "${{ github.event.before }}" \
              --head "${{ github.sha }}"
            ;;
          schedule)
            scripts/ci-scope.sh --all "scheduled audit"
            ;;
          *)
            scripts/ci-scope.sh --all "unsupported event"
            ;;
        esac

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-machete
      run: cargo install cargo-machete --version 0.9.2 --locked
    - name: Run dependency hygiene
      run: cargo xtask hygiene
    - name: Run cargo audit
      uses: actions-rust-lang/audit@v1
