name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  ASSURA_MAX_RELEASE_ARCHIVE_BYTES: 8388608

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Assets
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: assura-linux-amd64
            archive_name: assura-linux-amd64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: assura-linux-musl-amd64
            archive_name: assura-linux-musl-amd64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: assura-windows-amd64
            archive_name: assura-windows-amd64.zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: assura-macos-amd64
            archive_name: assura-macos-amd64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: assura-macos-arm64
            archive_name: assura-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo rustc --release --target ${{ matrix.target }} --bin assura --no-default-features --features json-output,yaml-config -- -C target-feature=+crt-static -C link-arg=-lgcc_eh
          else
            cargo build --release --target ${{ matrix.target }} --bin assura --no-default-features --features json-output,yaml-config
          fi
          cargo build --release --target ${{ matrix.target }} --bin assura-full

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p target/release-assets/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/assura target/${{ matrix.target }}/release/assura-full target/release-assets/${{ matrix.asset_name }}/
          tar -C target/release-assets/${{ matrix.asset_name }} -czf target/${{ matrix.archive_name }} assura assura-full

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release-assets/${{ matrix.asset_name }}
          Copy-Item target/${{ matrix.target }}/release/assura.exe target/release-assets/${{ matrix.asset_name }}/assura.exe
          Copy-Item target/${{ matrix.target }}/release/assura-full.exe target/release-assets/${{ matrix.asset_name }}/assura-full.exe
          Compress-Archive -Path target/release-assets/${{ matrix.asset_name }}/* -DestinationPath target/${{ matrix.archive_name }}

      - name: Enforce release archive size (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          bytes="$(wc -c < target/${{ matrix.archive_name }} | tr -d '[:space:]')"
          echo "${{ matrix.archive_name }}: ${bytes} bytes"
          test "$bytes" -le "$ASSURA_MAX_RELEASE_ARCHIVE_BYTES"

      - name: Enforce release archive size (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bytes = (Get-Item target/${{ matrix.archive_name }}).Length
          Write-Host "${{ matrix.archive_name }}: $bytes bytes"
          if ($bytes -gt [int64]$env:ASSURA_MAX_RELEASE_ARCHIVE_BYTES) {
            throw "Release archive exceeds size budget"
          }

      - name: Generate and verify checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum target/${{ matrix.archive_name }} > target/${{ matrix.archive_name }}.sha256
            sha256sum -c target/${{ matrix.archive_name }}.sha256
          else
            shasum -a 256 target/${{ matrix.archive_name }} > target/${{ matrix.archive_name }}.sha256
            shasum -a 256 -c target/${{ matrix.archive_name }}.sha256
          fi

      - name: Generate and verify checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = "target/${{ matrix.archive_name }}"
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline $checksum
          $recorded = (Get-Content $checksum).Split(" ")[0]
          if ($recorded -ne $hash) {
            throw "Checksum verification failed for $archive"
          }

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            target/${{ matrix.archive_name }}
            target/${{ matrix.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4

      - name: Download release archive artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/release-upload
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" target/release-upload/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "${{ github.ref_name }}" target/release-upload/* \
              --repo "${{ github.repository }}" \
              --title "Release ${{ github.ref_name }}" \
              --notes "Prebuilt Assura CLI archives for ${{ github.ref_name }}."
          fi
