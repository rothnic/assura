name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to republish from its immutable source
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  ASSURA_MAX_RELEASE_ARCHIVE_BYTES: 8388608
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  validate-release-contract:
    name: Validate Release Contract
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.release-source.outputs.package_version }}
      release_tag: ${{ steps.release-source.outputs.release_tag }}
      tag_oid: ${{ steps.release-source.outputs.tag_oid }}
      commit_oid: ${{ steps.release-source.outputs.commit_oid }}
      workflow_head_sha: ${{ steps.release-source.outputs.workflow_head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Match tag to package version and bind source
        id: release-source
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${DISPATCH_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          [[ "${release_tag}" =~ ^v[0-9A-Za-z.+-]+$ ]]
          ref_path="${RUNNER_TEMP}/release-ref.json"
          tag_path="${RUNNER_TEMP}/release-annotated-tag.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" > "${ref_path}"
          test "$(jq -r '.object.type // empty' "${ref_path}")" = "tag"
          tag_oid="$(jq -r '.object.sha // empty' "${ref_path}")"
          [[ "${tag_oid}" =~ ^[0-9a-fA-F]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_oid}" > "${tag_path}"
          identity="$(python3 scripts/release-contract.py resolve-tag \
            --tag "${release_tag}" \
            --event "${GITHUB_EVENT_NAME}" \
            --ref-json "${ref_path}" \
            --annotated-tag-json "${tag_path}")"
          tag_oid="$(jq -r '.tag_oid' <<<"${identity}")"
          commit_oid="$(jq -r '.commit_oid' <<<"${identity}")"
          git fetch --force origin "${commit_oid}"
          git checkout --detach "${commit_oid}"
          test "$(git rev-parse HEAD)" = "${commit_oid,,}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "assura") | .version')"
          test "v${package_version}" = "${release_tag}"
          {
            echo "package_version=${package_version}"
            echo "release_tag=${release_tag}"
            echo "tag_oid=${tag_oid}"
            echo "commit_oid=${commit_oid}"
            echo "workflow_head_sha=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate marketed release claims
        run: cargo xtask website-demo-data --check --released

      - name: Validate release readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release-readiness --format json

  build-release:
    name: Build Release Assets
    runs-on: ${{ matrix.os }}
    needs: validate-release-contract
    env:
      ASSURA_RELEASE_VERSION: ${{ needs.validate-release-contract.outputs.package_version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: assura-linux-amd64
            archive_name: assura-linux-amd64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: assura-linux-musl-amd64
            archive_name: assura-linux-musl-amd64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: assura-windows-amd64
            archive_name: assura-windows-amd64.zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: assura-macos-amd64
            archive_name: assura-macos-amd64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: assura-macos-arm64
            archive_name: assura-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-contract.outputs.commit_oid }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: assura-release-${{ runner.os }}-${{ matrix.target }}
          cache-all-crates: true

      - name: Summarize Rust cache
        shell: bash
        run: bash scripts/summarize-rust-cache.sh "Build Release Assets (${{ matrix.asset_name }})" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-release-${{ runner.os }}-${{ matrix.target }}"

      - name: Install cross-compilation tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo rustc --release --target ${{ matrix.target }} --bin assura --no-default-features --features json-output,yaml-config -- -C target-feature=+crt-static -C link-arg=-lgcc_eh
          else
            cargo build --release --target ${{ matrix.target }} --bin assura --no-default-features --features json-output,yaml-config
          fi
          cargo build --release --target ${{ matrix.target }} --bin assura-full

      - name: Verify release binaries (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          python3 scripts/release-contract.py assert-version \
            --version "$ASSURA_RELEASE_VERSION" \
            --binary "target/${{ matrix.target }}/release/assura" \
            --binary "target/${{ matrix.target }}/release/assura-full"

      - name: Verify release binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python scripts/release-contract.py assert-version `
            --version $env:ASSURA_RELEASE_VERSION `
            --binary "target/${{ matrix.target }}/release/assura.exe" `
            --binary "target/${{ matrix.target }}/release/assura-full.exe"

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p target/release-assets/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/assura target/${{ matrix.target }}/release/assura-full target/release-assets/${{ matrix.asset_name }}/
          tar -C target/release-assets/${{ matrix.asset_name }} -czf target/${{ matrix.archive_name }} assura assura-full

      - name: Verify packaged archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          python3 scripts/release-contract.py assert-archive \
            --version "$ASSURA_RELEASE_VERSION" \
            --archive "target/${{ matrix.archive_name }}"

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release-assets/${{ matrix.asset_name }}
          Copy-Item target/${{ matrix.target }}/release/assura.exe target/release-assets/${{ matrix.asset_name }}/assura.exe
          Copy-Item target/${{ matrix.target }}/release/assura-full.exe target/release-assets/${{ matrix.asset_name }}/assura-full.exe
          Compress-Archive -Path target/release-assets/${{ matrix.asset_name }}/* -DestinationPath target/${{ matrix.archive_name }}

      - name: Verify packaged archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python scripts/release-contract.py assert-archive `
            --version $env:ASSURA_RELEASE_VERSION `
            --archive "target/${{ matrix.archive_name }}"

      - name: Write release build evidence (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          python3 scripts/release-contract.py build-metadata \
            --asset-name "${{ matrix.asset_name }}" \
            --archive-name "${{ matrix.archive_name }}" \
            --version "$ASSURA_RELEASE_VERSION" \
            --output "target/${{ matrix.asset_name }}.release.json"

      - name: Write release build evidence (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python scripts/release-contract.py build-metadata `
            --asset-name "${{ matrix.asset_name }}" `
            --archive-name "${{ matrix.archive_name }}" `
            --version $env:ASSURA_RELEASE_VERSION `
            --output "target/${{ matrix.asset_name }}.release.json"

      - name: Enforce release archive size (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          bytes="$(wc -c < target/${{ matrix.archive_name }} | tr -d '[:space:]')"
          echo "${{ matrix.archive_name }}: ${bytes} bytes"
          test "$bytes" -le "$ASSURA_MAX_RELEASE_ARCHIVE_BYTES"

      - name: Enforce release archive size (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bytes = (Get-Item target/${{ matrix.archive_name }}).Length
          Write-Host "${{ matrix.archive_name }}: $bytes bytes"
          if ($bytes -gt [int64]$env:ASSURA_MAX_RELEASE_ARCHIVE_BYTES) {
            throw "Release archive exceeds size budget"
          }

      - name: Generate and verify checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256
            sha256sum -c ${{ matrix.archive_name }}.sha256
          else
            shasum -a 256 ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256
            shasum -a 256 -c ${{ matrix.archive_name }}.sha256
          fi

      - name: Generate and verify checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Push-Location target
          $archive = "${{ matrix.archive_name }}"
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline $checksum
          $recorded = (Get-Content $checksum).Split(" ")[0]
          if ($recorded -ne $hash) {
            throw "Checksum verification failed for $archive"
          }
          Pop-Location

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            target/${{ matrix.archive_name }}
            target/${{ matrix.archive_name }}.sha256
            target/${{ matrix.asset_name }}.release.json
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release-contract, build-release]
    env:
      ASSURA_RELEASE_VERSION: ${{ needs.validate-release-contract.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-contract.outputs.commit_oid }}
          fetch-depth: 0

      - name: Download release archive artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/release-upload
          merge-multiple: true

      - name: Publish verified or missing assets safely
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-release-assets.py \
            --repository "${{ github.repository }}" \
            --tag "${{ needs.validate-release-contract.outputs.release_tag }}" \
            --version "$ASSURA_RELEASE_VERSION" \
            --tag-oid "${{ needs.validate-release-contract.outputs.tag_oid }}" \
            --commit-oid "${{ needs.validate-release-contract.outputs.commit_oid }}" \
            --assets-dir target/release-upload \
            --output target/release-publish.json

      - name: Verify installed release version
        shell: bash
        run: |
          mkdir -p target/release-install
          tar -xzf target/release-upload/assura-linux-amd64.tar.gz -C target/release-install
          python3 scripts/release-contract.py assert-version \
            --version "$ASSURA_RELEASE_VERSION" \
            --binary target/release-install/assura \
            --binary target/release-install/assura-full

      - name: Write durable release receipt
        shell: bash
        run: |
          python3 scripts/release-contract.py receipt \
            --repository "${{ github.repository }}" \
            --version "$ASSURA_RELEASE_VERSION" \
            --tag "${{ needs.validate-release-contract.outputs.release_tag }}" \
            --tag-oid "${{ needs.validate-release-contract.outputs.tag_oid }}" \
            --commit-oid "${{ needs.validate-release-contract.outputs.commit_oid }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --assets-dir target/release-upload \
            --install-dir target/release-install \
            --publish-json target/release-publish.json \
            --output target/release-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("target/release-receipt.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          runs = receipt["workflow_runs"]
          if len(runs) != 1:
              raise SystemExit("expected exactly one release workflow run")
          runs[0]["run_head_sha"] = "${{ needs.validate-release-contract.outputs.workflow_head_sha }}"
          runs[0]["release_source_commit_oid"] = "${{ needs.validate-release-contract.outputs.commit_oid }}"
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload durable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: assura-release-evidence-${{ needs.validate-release-contract.outputs.release_tag }}
          path: |
            target/release-receipt.json
            target/release-publish.json
          if-no-files-found: error
          retention-days: 90
