name: R03 Performance Variance Diagnostic

on:
  workflow_dispatch:
    inputs:
      commit:
        description: full 40-character commit SHA to measure.
        required: true
        type: string
      mode:
        description: Run the unchanged strict variance collection or the bounded Callgrind observation.
        required: true
        default: variance
        type: choice
        options:
          - variance
          - callgrind

permissions:
  contents: read

jobs:
  diagnose:
    name: Retain strict paired cold evidence
    if: ${{ inputs.mode == '' || inputs.mode == 'variance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.commit }}
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Collect repeated exact cold reports
      env:
        ASSURA_PERF_VARIANCE_COMMIT: ${{ inputs.commit }}
      run: scripts/r03-performance-variance.sh
    - name: Upload raw R03 variance evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: r03-performance-variance
        path: target/performance/r03-performance-variance
        if-no-files-found: error
        retention-days: 14

  callgrind:
    name: Describe accepted workload instructions
    if: ${{ inputs.mode == 'callgrind' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: debian:bookworm-20260918-slim@sha256:f3034a6ec3c1205360777c4aae76234998866ad18806ae62b63a3f84ccad782b
    env:
      ASSURA_NU11_COMMIT: ${{ inputs.commit }}
      ASSURA_NU11_MODE: ${{ inputs.mode }}
    steps:
    - name: Reject source or ref mismatch before tool setup
      shell: bash
      run: |
        set -euo pipefail
        [[ "$ASSURA_NU11_COMMIT" =~ ^[0-9a-f]{40}$ ]]
        [[ "$GITHUB_SHA" == "$ASSURA_NU11_COMMIT" ]]
        [[ "$GITHUB_REF" == refs/heads/* ]]
        [[ "$GITHUB_REF" != refs/heads/master && "$GITHUB_REF" != refs/heads/main ]]
        echo "ASSURA_NU11_STARTED_UTC=$(date +%s)" >> "$GITHUB_ENV"
    - name: Bootstrap checkout prerequisites from the signed snapshot
      id: nu11_bootstrap
      shell: bash
      timeout-minutes: 5
      run: |
        set -euo pipefail
        bootstrap="$RUNNER_TEMP/nu11-bootstrap"
        echo "evidence_path=$bootstrap" >> "$GITHUB_OUTPUT"
        mkdir -m 700 "$bootstrap"
        printf '%s\n' 'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260918T000000Z bookworm main' > "$bootstrap/sources.list"
        opts=(-o "Dir::Etc::sourcelist=$bootstrap/sources.list" -o Dir::Etc::sourceparts=- -o Acquire::Check-Valid-Until=false -o Acquire::Retries=0 -o Acquire::http::Timeout=30)
        set +e
        timeout 120 apt-get "${opts[@]}" update > "$bootstrap/update.stdout" 2> "$bootstrap/update.stderr"
        status=$?
        printf '%s\n' "$status" > "$bootstrap/update.exit"
        set -e
        [[ "$status" == 0 ]]
        set +e
        DEBIAN_FRONTEND=noninteractive timeout 120 apt-get "${opts[@]}" install -y --no-install-recommends git ca-certificates curl xz-utils python3 > "$bootstrap/install.stdout" 2> "$bootstrap/install.stderr"
        status=$?
        printf '%s\n' "$status" > "$bootstrap/install.exit"
        set -e
        [[ "$status" == 0 ]]
        dpkg-query -W git ca-certificates curl xz-utils python3 > "$bootstrap/packages.txt"
        sha256sum /var/lib/apt/lists/*InRelease > "$bootstrap/signed-metadata.sha256"
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.commit }}
    - name: Verify checked-out source before tool setup
      shell: bash
      run: |
        set -euo pipefail
        # This exact trust entry lives only in the disposable job container.
        git config --system --add safe.directory "$GITHUB_WORKSPACE"
        git config --system --get-all safe.directory > "$RUNNER_TEMP/nu11-bootstrap/git-safe-directory.txt"
        actual_head="$(git rev-parse HEAD)"
        [[ "$actual_head" == "$ASSURA_NU11_COMMIT" ]]
        source_status="$(git status --porcelain --untracked-files=normal)"
        [[ -z "$source_status" ]]
    - name: Admit resources before Rust and Node setup
      timeout-minutes: 2
      run: |
        python3 - <<'PY'
        import hashlib, importlib.util, json, os, sys, time
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"]) / "nu11-bootstrap"
        script = Path("scripts/nu11-callgrind-profile.py").resolve()
        phase = {"phase": "pre-tool-admission", "source_commit": os.environ["ASSURA_NU11_COMMIT"],
                 "script_sha256": hashlib.sha256(script.read_bytes()).hexdigest(), "outcome": "checking"}
        evidence = None
        try:
            spec = importlib.util.spec_from_file_location("nu11_profile", script)
            module = importlib.util.module_from_spec(spec)
            sys.modules[spec.name] = module
            spec.loader.exec_module(module)
            evidence = module.Evidence(root, {}, Path.cwd())
            elapsed = time.time() - int(os.environ["ASSURA_NU11_STARTED_UTC"])
            if elapsed < 0:
                raise module.GateFailure("workflow start time is in the future")
            evidence.started -= elapsed
            evidence.check_budget()
            module.admit_after_bootstrap(evidence, Path.cwd())
            phase["outcome"] = "admitted"
        except BaseException as error:
            phase.update(outcome="rejected_or_unknown", failure=f"{type(error).__name__}: {error}")
            raise
        finally:
            if evidence is not None:
                evidence.state.update(phase)
                evidence.save()
            else:
                (root / "admission.json").write_text(json.dumps(phase, indent=2) + "\n")
        PY
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Run bounded Callgrind observation
      run: python3 scripts/nu11-callgrind-profile.py
    - name: Upload raw NU11 profile evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: nu11-callgrind-${{ inputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          target/performance/nu11-callgrind-profile/${{ inputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          ${{ steps.nu11_bootstrap.outputs.evidence_path }}
        if-no-files-found: error
        retention-days: 14
