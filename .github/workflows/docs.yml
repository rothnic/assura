name: Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Documentation Scope
    runs-on: ubuntu-latest
    outputs:
      rustdoc: ${{ steps.scope.outputs.rustdoc }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Classify changed paths
      id: scope
      shell: bash
      run: |
        case "${{ github.event_name }}" in
          pull_request)
            scripts/ci-scope.sh \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --merge-base
            ;;
          push)
            scripts/ci-scope.sh \
              --base "${{ github.event.before }}" \
              --head "${{ github.sha }}"
            ;;
          *)
            scripts/ci-scope.sh --all "unsupported event"
            ;;
        esac

  docs:
    name: Build Documentation
    needs: changes
    if: needs.changes.outputs.rustdoc == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-docs-${{ runner.os }}-stable
        cache-all-crates: true
    - name: Summarize Rust cache
      run: bash scripts/summarize-rust-cache.sh "Build Documentation" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-docs-${{ runner.os }}-stable"
    - name: Build docs
      run: cargo doc --no-deps --all-features
      env:
        RUSTDOCFLAGS: "-D warnings"
    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/doc
        destination_dir: docs
        force_orphan: true
