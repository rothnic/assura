name: Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Documentation Scope
    runs-on: ubuntu-latest
    outputs:
      rustdoc: ${{ steps.scope.outputs.rustdoc }}
      website: ${{ steps.scope.outputs.website }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Classify changed paths
      id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/ci-scope-github.sh

  docs:
    name: Build Documentation
    needs: changes
    if: needs.changes.outputs.rustdoc == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: assura-docs-${{ runner.os }}-stable
        cache-all-crates: true
    - name: Summarize Rust cache
      run: bash scripts/summarize-rust-cache.sh "Build Documentation" "${{ steps.rust-cache.outputs.cache-hit }}" "assura-docs-${{ runner.os }}-stable"
    - name: Build docs
      run: cargo doc --no-deps --all-features
      env:
        RUSTDOCFLAGS: "-D warnings"
    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/doc
        destination_dir: docs
        force_orphan: true

  website:
    name: Verify Marketing Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.25.0
    - name: Install website dependencies
      run: pnpm --dir website install --frozen-lockfile
    - name: Install Playwright Chromium
      working-directory: website
      run: pnpm exec playwright install --with-deps chromium
    - name: Verify generated marketing evidence and build
      run: cargo xtask docs
    - name: Verify production claims are in the candidate release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      run: cargo xtask website-demo-data --check --released
    - name: Verify responsive marketing experience
      run: pnpm --dir website test:marketing
    - name: Upload visual verification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: marketing-visual-verification
        path: |
          website/test-results
          website/playwright-report
        if-no-files-found: error
        retention-days: 30
