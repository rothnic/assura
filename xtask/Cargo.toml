[package]
name = "xtask"
version = "0.4.0"
edition = "2021"
description = "Repository-local Assura maintenance tasks"
license = "MIT OR Apache-2.0"
rust-version = "1.70.0"
publish = false

[dependencies]
pulldown-cmark = "0.9"
# Release gates compare stable and release-candidate versions with SemVer precedence.
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
