[package]
name = "assura"
version = "0.4.0"
edition = "2021"
default-run = "assura"
authors = ["Assura Team <team@assura.dev>"]
description = "Structure-first repository validation CLI with naming, markdown, and LS-Lint migration support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rothnic/assura"
homepage = "https://assura.dev"
documentation = "https://docs.rs/assura"
keywords = ["validation", "linting", "filesystem", "structure", "naming-conventions"]
categories = ["development-tools", "filesystem", "command-line-utilities"]
rust-version = "1.86.0"
readme = "README.md"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[workspace]
members = [".", "crates/assura-check-cli", "crates/assura-stable-hash", "crates/assura-watch-state", "xtask"]
default-members = [".", "crates/assura-check-cli", "crates/assura-stable-hash", "crates/assura-watch-state", "xtask"]

[[bin]]
name = "assura"
path = "src/main.rs"
required-features = ["json-output", "yaml-config"]

[[bin]]
name = "assura-full"
path = "src/assura_full.rs"
required-features = ["full-cli"]

[features]
default = ["full-cli"]
full-cli = [
    "dep:anyhow",
    "dep:bincode",
    "dep:clap",
    "dep:frontmatter",
    "dep:lazy_static",
    "dep:petgraph",
    "dep:pulldown-cmark",
    "dep:rayon",
    "dep:regex",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:validator",
    "dep:windows-sys",
    "watch-events",
    "dep:jwalk",
    "dep:jsonschema",
    "json-output",
    "yaml-config",
]
git-signals = ["dep:git2"]
json-output = ["dep:serde_json"]
watch-events = ["dep:assura-watch-state", "dep:notify"]
yaml-config = ["dep:serde_yaml"]

[dependencies]
assura-stable-hash = { path = "crates/assura-stable-hash" }
assura-watch-state = { path = "crates/assura-watch-state", optional = true }
tokio = { version = "1.0", features = ["full", "rt-multi-thread"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { version = "0.9", optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0"
anyhow = { version = "1.0", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }
petgraph = { version = "0.6", optional = true }
# Full regex is kept for markdown, legacy config preprocessing, and richer
# full-CLI validators; the check-only path uses regex-lite for lower startup
# and binary-size pressure.
regex = { version = "1.0", optional = true }
regex-lite = "0.1.9"
glob = "0.3"
walkdir = "2.0"
pico-args = "0.5"
# Structured TOML parsing backs the manifest-semantics rule; avoid ad hoc
# string scanning for Cargo manifest policy checks.
toml = "0.8"
# Stable review finding identities must survive processes, versions, and worktrees.
sha2 = "0.10"
rayon = { version = "1.7", optional = true }
bincode = { version = "1.3", optional = true }
git2 = { version = "0.20.2", optional = true, features = ["https", "ssh"] }
pulldown-cmark = { version = "0.9", optional = true }
frontmatter = { version = "0.4", optional = true }
lazy_static = { version = "1.4", optional = true }
validator = { version = "0.19", features = ["derive"], optional = true }
jwalk = { version = "0.8.1", optional = true }
# Runtime content-object validation compiles checked-in JSON Schema artifacts
# into Rust validators; authoring tools remain build-time only.
jsonschema = { version = "=0.26.2", optional = true }
notify = { version = "6.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1.0"
mockall = "0.11"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[[bench]]
name = "graph_benchmarks"
harness = false

[[bench]]
name = "ls_lint_benchmarks"
harness = false

[[bench]]
name = "ls_lint_comparison"
harness = false

[[bench]]
name = "profiling"
harness = false

[[bench]]
name = "content_runtime"
harness = false

[[bench]]
name = "project_intelligence"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
