structure: {}

models:
  source: schemas/content-runtime.linkml.yaml
  validation_artifact: schemas/content_runtime.schema.json

collections:
  goals:
    class: Goal
    path: docs/goals/*.yml
    adapter: yaml_record
    id: id
  specs:
    class: Spec
    path: specs/*.yml
    adapter: yaml_record
    id: id

relations:
  goals.specs:
    target: specs
    many: true
