claims:
  - id: agent-onboarding
    copy: Establish an agent-ready baseline and report what still needs a human decision.
    status: experimental
    command: assura agent onboard . --agent auto --format json
    smoke_args: [agent, onboard, ., --agent, auto, --format, json]
    expected_exit: 1

  - id: compact-review
    copy: Review configured health, inactive capabilities, branch state, worktree state, and hot directories.
    status: experimental
    command: assura review
    smoke_args: [review]
    expected_exit: 0

  - id: path-explanation
    copy: Explain the effective structure policy for one path.
    status: experimental
    command: assura explain apps/web/src
    smoke_args: [explain, apps/web/src]
    expected_exit: 0

  - id: configured-policy-gate
    copy: Enforce configured policy before merge.
    status: supported
    command: assura check
    smoke_args: [check]
    expected_exit: 1

  - id: codex-agent-report
    copy: Return bounded shared agent feedback through the Codex adapter.
    status: supported
    command: assura check --format agent --agent codex .
    smoke_args: [check, --format, agent, --agent, codex, .]
    expected_exit: 1

  - id: cold-ls-lint-comparison
    copy: Faster in every accepted cold comparison in the current checked cohort.
    status: evidence-backed
    source: website/src/data/performance-summary.json

  - id: warm-session-performance
    copy: Persistent warm sessions exceed the 2x target in every accepted case.
    status: evidence-backed
    source: website/src/data/performance-summary.json

  - id: explicit-review-base
    copy: Select an explicit comparison base.
    status: experimental
    command: assura review --base main
    smoke_args: [review, --base, main]
    expected_exit: 0

  - id: finding-history
    copy: Distinguish new, worsened, unchanged, and resolved findings.
    status: experimental
    command: assura review --format agent
    smoke_args: [review, --format, agent]
    expected_exit: 0

  - id: cache-observability
    copy: Inspect worktree-local and shared immutable cache namespaces and fallback state.
    status: experimental
    command: assura cache status --format json
    smoke_args: [cache, status, --format, json]
    expected_exit: 0
