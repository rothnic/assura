rules:
  source-file:
    naming: kebab-case
    max_lines: 500
  web-app:
    package.json: exists:1
    src/: exists:1

structure:
  ./:
    use: $agentic-project
    extra: false
    "./**/*.{ts,tsx}": $source-file
    docs/: exists:0-1
    apps/:
      .dir: kebab-case
      web/: $web-app

exclude:
  - "**/{generated,vendor,dist}/**"
