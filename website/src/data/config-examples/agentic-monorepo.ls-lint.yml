# Closest valid LS-Lint filesystem coverage.
ls:
  # Project-local skill directories.
  .agents:
    skills:
      .dir: kebab-case
      "*":
        .dir: kebab-case
        "{agents,assets,references,scripts}":
          .dir: kebab-case
        "*":
          .dir: exists:0
        .*: exists:0
        .md: regex:SKILL | exists:1

  # App and package naming repeats at each scoped tree.
  "{apps,packages}":
    .dir: kebab-case
    "*":
      .dir: kebab-case
      .js: kebab-case
      .jsx: kebab-case
      .md: kebab-case | regex:(AGENTS|README)
      .ts: kebab-case
      .tsx: kebab-case

  # Global directory and authored-file naming.
  .dir: kebab-case
  .js: kebab-case
  .jsx: kebab-case
  .md: kebab-case | regex:(AGENTS|README)
  .ts: kebab-case
  .tsx: kebab-case
  .yaml: kebab-case

ignore:
  - .assura
  - .git
  - "**/{node_modules,.next,.turbo,dist,coverage}/**"
