rules:
  "@package-standard":
    extra: false
    AGENTS.md: exists:1
    package.json: exists:1
    README.md: exists:0-1
    tsconfig.json: exists:0-1
    src/:
      required: true
      .ts: kebab-case
    tests/:
      required: false
      .test.ts: kebab-case
    fixtures/: exists:0-1

structure:
  ./:
    use: "@agentic-project"
    files:
      max_lines: 500
    package.json: exists:1
    packages/:
      required: false
      .dir: kebab-case
      "{package}/":
        use: "@package-standard"
      ui-kit/:
        use: "@package-standard"
        stories/:
          required: false
          .tsx: PascalCase
