rules:
  "@source-file":
    naming: kebab-case
    max_lines: 500

  "@package-standard":
    extra: false
    AGENTS.md: exists:1
    package.json: exists:1
    README.md: exists:0-1
    tsconfig.json: exists:0-1
    src/:
      required: true
      .ts: "@source-file"
      .tsx: "@source-file"
    tests/:
      required: false
      .test.ts: "@source-file"
    fixtures/: exists:0-1

structure:
  ./:
    use: "@agentic-project"
    package.json: exists:1
    packages/:
      required: false
      .dir: kebab-case
      "{package}/":
        use: "@package-standard"
