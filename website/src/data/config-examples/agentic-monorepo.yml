rules:
  "@source-file":
    naming: kebab-case
    max_lines: 500

  "@package-standard":
    .dir: kebab-case
    extra: false
    AGENTS.md: exists:1
    package.json: exists:1
    README.md: exists:0-1
    tsconfig.json: exists:0-1
    src/: exists:1
    tests/:
      exists: 0-1
      .test.ts: "@source-file"
    fixtures/: exists:0-1

structure:
  ./:
    use: "@agentic-project"
    .ts: "@source-file"
    .tsx: "@source-file"
    package.json: exists:1
    packages/:
      exists: 0-1
      "{package}/": "@package-standard"
      ui-kit/:
        use: "@package-standard"
        stories/: exists:0-1

exclude:
  - "**/generated/**"
  - "**/vendor/**"
  - "**/dist/**"
